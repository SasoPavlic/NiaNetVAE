[tool.poetry]
name = "nianetvae"
version = "2.0.0"
description = "Controlled MetroPT predictive-maintenance model comparison and NiaNetVAE search"
authors = ["Sašo Pavlič <saso.pavlic3@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "nianetvae", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = "1.26.4"
pandas = "2.3.3"
PyYAML = "6.0.3"
torch = "2.9.1"
scikit-learn = "1.7.2"
joblib = "1.5.3"
pymoo = "0.6.1.6"
dill = "0.3.9"
matplotlib = "3.10.8"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.3,<9"
ruff = ">=0.15,<1"

[tool.poetry.scripts]
nianetvae = "nianetvae.cli:main"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
